# Lake package of proofs that geth v1.17.10's MODEXP machine code meets the EthLib MODEXP specification.
name = "fvmodexp"
defaultTargets = ["FvModexp"]

# Project-wide: no auto-bound implicits (every binder explicit). Janus applies this table to its own compile of FvModexp
# (`-DautoImplicit=false`, part of the olean-store key); the dev scripts pass the same option.
[leanOptions]
autoImplicit = false

[[require]]
name = "janus"
git = "https://github.com/Giulio2002/Janus.git"
rev = "b5db64328e92cf4a5d5b87c32a9c66844b0d892b"

# ethereum/EthLib MODEXP spec, byte-identical to upstream ffd60c4b (see its UPSTREAM.md), on Lean v4.34.1.
[[require]]
name = "ethlibspec"
git = "https://github.com/Giulio2002/EthLib.git"
rev = "f4756ef5dc5619357f336e81166fb64a139abcd7"

[[lean_lib]]
name = "FvModexp"
